<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Card ISW-521</title>
  <style>
    body {
      background: #f0f0f0;
      font-family: 'Segoe UI', sans-serif;
    }

    .card {
      width: 500px;
      margin: 16px;
      border: 2px solid #ccc;
      padding: 20px;
      background: #fff;
    }

    .card-header {
      background: #1a3a6b;
      color: white;
      padding: 20px;
      font-size: 1.6rem;
      font-weight: bold;
    }

    .card-line {
      height: 6px;
      background: #f0a500;
      margin: 0;
    }

    .card-body {
      padding: 20px;
    }

    .card-body h2 {
      font-size: 1rem;
      margin-bottom: 10px;
      color: #111;
    }

    .card-body p {
      font-size: 0.9rem;
      color: #444;
      margin-bottom: 16px;
    }

    .card-body a {
      display: block;
      background: #1a3a6b;
      color: #f0a500;
      text-align: center;
      padding: 12px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">ISW-521</div>
    <div class="card-line"></div>
    <div class="card-body">
      <h2>Programación en Ambiente Web I</h2>
      <p>Aprende a construir aplicaciones web modernas con HTML, CSS y JavaScript.</p>
      <a href="#">Ver curso →</a>
    </div>
  </div>

</body>
</html>
